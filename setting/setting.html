<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>矿工设置</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 14px;
            width: 320px;
            padding: 20px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 180px;
            color: #fff;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .header-icon {
            font-size: 24px;
        }

        .header-title {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
        }

        .engine-grid {
            display: flex;
            gap: 12px;
        }

        .engine-card {
            flex: 1;
            position: relative;
            cursor: pointer;
            border-radius: 12px;
            padding: 16px 12px;
            text-align: center;
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.1);
            transition: all 0.3s ease;
        }

        .engine-card:hover {
            background: rgba(255,255,255,0.1);
            transform: translateY(-2px);
        }

        .engine-card.selected {
            background: rgba(79, 172, 254, 0.15);
            border-color: #4facfe;
            box-shadow: 0 4px 20px rgba(79, 172, 254, 0.3);
        }

        .engine-icon {
            font-size: 28px;
            margin-bottom: 8px;
            display: block;
        }

        .engine-name {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 4px;
        }

        .engine-desc {
            font-size: 11px;
            color: rgba(255,255,255,0.5);
        }

        .engine-card.selected .engine-name {
            color: #4facfe;
        }

        .engine-card.selected::after {
            content: '✓';
            position: absolute;
            top: 8px;
            right: 8px;
            width: 18px;
            height: 18px;
            background: #4facfe;
            border-radius: 50%;
            font-size: 11px;
            line-height: 18px;
            color: #1a1a2e;
            font-weight: bold;
        }

        .status-bar {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .status-label {
            font-size: 12px;
            color: rgba(255,255,255,0.5);
        }

        .status-value {
            font-size: 12px;
            font-weight: 600;
            color: #4facfe;
            padding: 4px 10px;
            background: rgba(79, 172, 254, 0.15);
            border-radius: 20px;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(79, 172, 254, 0.9);
            color: #1a1a2e;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .pulse {
            animation: pulse 0.3s ease;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
    <script src="../js/jquery.min.js"></script>
    <script src="../js/toolkit.js"></script>
    <script src="setting.js"></script>
</head>
<body>
    <div class="header">
        <span class="header-icon">⚙️</span>
        <span class="header-title">番号检索引擎</span>
    </div>

    <div class="engine-grid">
        <div class="engine-card" data-engine="DB">
            <span class="engine-icon">🗃️</span>
            <div class="engine-name">JavDB</div>
            <div class="engine-desc">数据库全面</div>
        </div>

        <div class="engine-card" data-engine="Bus">
            <span class="engine-icon">🚌</span>
            <div class="engine-name">JavBus</div>
            <div class="engine-desc">搜索速度快</div>
        </div>
    </div>

    <div class="status-bar">
        <span class="status-label">当前引擎</span>
        <span class="status-value">--</span>
    </div>
</body>
</html>
